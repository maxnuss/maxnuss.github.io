<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashback Support</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2rem;
      line-height: 1.2;
      color: #111827;
    }

    p {
      margin: 0 0 12px;
      font-size: 1rem;
      line-height: 1.6;
      color: #4b5563;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Flashback Support</h1>
    <p>If you have questions or need help, contact:</p>
    <p>
      <a href="mailto:flashbackappsupport@gmail.com">flashbackappsupport@gmail.com</a>
    </p>
  </main>
</body>
</html>
